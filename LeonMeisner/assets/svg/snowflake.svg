<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100">

    <defs>
        <g id="arm">
            <!-- Hauptarm -->
            <line x1="50" y1="50" x2="50" y2="10" />

            <!-- große Seitenäste -->
            <line x1="50" y1="22" x2="39" y2="31" />
            <line x1="50" y1="22" x2="61" y2="31" />

            <!-- kleine Seitenäste -->
            <line x1="50" y1="34" x2="44" y2="40" />
            <line x1="50" y1="34" x2="56" y2="40" />
        </g>
    </defs>

    <g stroke="#27445c"
       stroke-width="3"
       stroke-linecap="round"
       fill="none">

        <use href="#arm" />
        <use href="#arm" transform="rotate(60 50 50)" />
        <use href="#arm" transform="rotate(120 50 50)" />
        <use href="#arm" transform="rotate(180 50 50)" />
        <use href="#arm" transform="rotate(240 50 50)" />
        <use href="#arm" transform="rotate(300 50 50)" />

        <!-- Mittelpunkt -->
        <circle cx="50" cy="50" r="3" fill="#27445c" />

    </g>

</svg>